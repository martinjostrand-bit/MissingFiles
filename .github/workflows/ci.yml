name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings as errors, .NET analyzers)
        run: dotnet build -c Release --no-restore

      - name: Unit and functional tests
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Check line coverage of MissingFiles.Core (>= 80 %)
        shell: pwsh
        run: |
          $rates = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | ForEach-Object {
            ([xml](Get-Content $_.FullName)).coverage.packages.package |
              Where-Object name -eq 'MissingFiles.Core' |
              ForEach-Object { [double]::Parse($_.'line-rate', [cultureinfo]::InvariantCulture) }
          }
          if (-not $rates) { Write-Error 'No coverage data found for MissingFiles.Core'; exit 1 }
          $rate = ($rates | Measure-Object -Maximum).Maximum
          Write-Output ('MissingFiles.Core line coverage: {0:P1}' -f $rate)
          if ($rate -lt 0.80) { Write-Error 'Line coverage of MissingFiles.Core is below 80 %'; exit 1 }

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $output
          if ($output -match 'has the following vulnerable packages') { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Publish single-file executables
        shell: pwsh
        run: |
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
                      '-p:EnableCompressionInSingleFile=true', '-p:DebugType=none', '-o', 'publish')
          dotnet publish src/MissingFiles.App @common
          dotnet publish src/MissingFiles.Cli @common

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: MissingFiles-win-x64
          path: |
            publish/*.exe
            publish/FileTypes.default.json
