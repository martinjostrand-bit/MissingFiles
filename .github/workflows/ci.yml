name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # BB of the revision (CM-02): GITHUB_RUN_NUMBER of this workflow, for every build and publish below.
  # Directory.Build.props reads it. Set here only, so builds in other workflows do not use their own run number.
  MissingFilesBuildNumber: ${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings as errors, .NET analyzers)
        run: dotnet build -c Release --no-restore

      - name: Unit, functional and UI smoke tests
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Check line coverage of MissingFiles.Core (>= 80 %)
        shell: pwsh
        run: |
          $rates = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | ForEach-Object {
            ([xml](Get-Content $_.FullName)).coverage.packages.package |
              Where-Object name -eq 'MissingFiles.Core' |
              ForEach-Object { [double]::Parse($_.'line-rate', [cultureinfo]::InvariantCulture) }
          }
          if (-not $rates) { Write-Error 'No coverage data found for MissingFiles.Core'; exit 1 }
          $rate = ($rates | Measure-Object -Maximum).Maximum
          Write-Output ('MissingFiles.Core line coverage: {0:P1}' -f $rate)
          if ($rate -lt 0.80) { Write-Error 'Line coverage of MissingFiles.Core is below 80 %'; exit 1 }

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0) { Write-Error 'The check for vulnerable packages did not run'; exit 1 }
          if ($output -match 'has the following vulnerable packages') { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      # Self-contained single-file MissingFiles.exe and MissingFiles.Cli.exe, zipped with FileTypes.default.json
      # and LICENSE as MissingFiles-XX.YY.ZZ.BB-win-x64.zip (NFR-10, CM-06). /release publishes this zip.
      - name: Build the release zip
        shell: pwsh
        run: ./build/Package.ps1 -Output artifacts

      - name: Upload the release zip
        uses: actions/upload-artifact@v7
        with:
          name: MissingFiles-win-x64
          if-no-files-found: error
          # The zip is already compressed.
          compression-level: 0
          path: artifacts/MissingFiles-*-win-x64.zip
